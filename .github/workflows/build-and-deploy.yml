name: Build, Test & Deploy Blitz Arena (Solana Devnet)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_devnet:
        description: "Deploy compiled program to Solana Devnet"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: blitz-arena-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-anchor-program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust 1.89 (Anchor program build)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"

      - name: Setup stable Rust (Anchor IDL & unit tests)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default 1.89.0

      - name: Install native deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config

      - name: Install Solana Agave 3.1.9
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.9/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor 1.0.2 (prebuilt binary)
        run: |
          curl -sSfL -o /tmp/anchor \
            https://github.com/solana-foundation/anchor/releases/download/v1.0.2/anchor-1.0.2-x86_64-unknown-linux-gnu
          sudo install -m 755 /tmp/anchor /usr/local/bin/anchor
          anchor --version

      - name: Cache Cargo & SBF build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/solana
            target
          key: blitz-arena-${{ hashFiles('Cargo.toml', 'programs/**/Cargo.toml', 'programs/**/*.rs') }}
          restore-keys: |
            blitz-arena-

      - name: Run Rust PnL & liquidation unit tests
        run: cargo +stable test --manifest-path programs/blitz-arena/Cargo.toml

      - name: Build Anchor SBF program & IDL
        run: anchor build --ignore-keys

      - name: Upload compiled program (.so) and IDL artifact
        uses: actions/upload-artifact@v4
        with:
          name: blitz-arena-program-artifacts
          path: |
            target/deploy/blitz_arena.so
            target/idl/blitz_arena.json

  deploy-devnet:
    needs: build-anchor-program
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_devnet == 'true') || contains(github.event.head_commit.message, '[deploy-devnet]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Download compiled program (.so) & IDL
        uses: actions/download-artifact@v4
        with:
          name: blitz-arena-program-artifacts
          path: target/deploy

      - name: Install Solana Agave 3.1.9
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.1.9/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Deploy blitz_arena.so to Solana Devnet via HTTPS RPC (--use-rpc)
        env:
          SOLANA_DEPLOYER_KEYPAIR: ${{ secrets.SOLANA_DEPLOYER_KEYPAIR }}
          PROGRAM_KEYPAIR: ${{ secrets.PROGRAM_KEYPAIR }}
        run: |
          mkdir -p ~/.config/solana target/deploy
          if [ -z "$SOLANA_DEPLOYER_KEYPAIR" ]; then
            echo "ERROR: SOLANA_DEPLOYER_KEYPAIR secret is missing."
            exit 1
          fi
          echo "$SOLANA_DEPLOYER_KEYPAIR" > ~/.config/solana/id.json
          if [ -n "$PROGRAM_KEYPAIR" ]; then
            echo "$PROGRAM_KEYPAIR" > target/deploy/blitz_arena-keypair.json
          fi

          RPC_URL="https://rpc.magicblock.app/devnet"
          solana config set --url "$RPC_URL" --keypair ~/.config/solana/id.json
          solana address
          solana balance

          # Reclaim any orphaned buffer accounts from prior attempts
          solana program close --buffers --bypass-warning || true
          solana balance

          # --use-rpc bypasses UDP/QUIC blocking on GitHub Actions runners
          solana program deploy target/deploy/blitz_arena.so \
            --program-id target/deploy/blitz_arena-keypair.json \
            --url "$RPC_URL" \
            --use-rpc \
            --with-compute-unit-price 50000 \
            --max-sign-attempts 100

          PROGRAM_ID=$(solana address -k target/deploy/blitz_arena-keypair.json)
          solana program show "$PROGRAM_ID" --url "$RPC_URL"
          echo "DEPLOYED_PROGRAM_ID=$PROGRAM_ID"
          echo "EXPLORER=https://explorer.solana.com/address/$PROGRAM_ID?cluster=devnet"

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install & Build Frontend
        working-directory: app
        run: |
          npm install
          npm run build
